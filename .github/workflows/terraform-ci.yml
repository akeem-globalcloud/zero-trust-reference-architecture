name: Terraform CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  terraform:
    name: Validate All Deployment Examples
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.2

      - name: Display Terraform Version
        run: terraform version

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        shell: bash
        run: |
          tflint --init

          find terraform/deployment-examples \
            -mindepth 1 \
            -maxdepth 1 \
            -type d | sort | while IFS= read -r deployment
          do
            if [ -f "$deployment/main.tf" ]; then
              echo "Running TFLint for $deployment"
              tflint --chdir="$deployment"
            fi
          done

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: terraform
          format: table
          exit-code: "1"

      - name: Validate Terraform deployment examples
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tfplans

          find terraform/deployment-examples \
            -mindepth 1 \
            -maxdepth 1 \
            -type d | sort | while IFS= read -r deployment
          do
            echo ""
            echo "========================================"
            echo "Processing deployment: $deployment"
            echo "========================================"

            if [ ! -f "$deployment/main.tf" ]; then
              echo "Skipping $deployment (main.tf not found)"
              continue
            fi

#            terraform -chdir="$deployment" fmt -check -recursive
#            terraform -chdir="$deployment" init -input=false
#            terraform -chdir="$deployment" validate

#            terraform -chdir="$deployment" plan \
#              -input=false \
#              -out=tfplan

 #           deployment_name=$(basename "$deployment")
 #           cp "$deployment/tfplan" "tfplans/${deployment_name}.tfplan"

          done

